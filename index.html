<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kryptonbrowser — CBT SMP Negeri 3 Jayapura</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #020617;
      --surface: rgba(15, 23, 42, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top center, #0c1936 0%, var(--bg) 58%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28);
    }
    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.24);
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    a.capsule:hover {
      border-color: rgba(148, 163, 184, 0.5);
      color: #ffffff;
    }
    .capsule-accent {
      background: rgba(14, 165, 233, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38bdf8;
    }
    .hero {
      text-align: center;
      padding: 40px 0;
    }
    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--emerald);
      display: inline-block;
    }
    .hero h1 {
      margin: 18px 0 10px;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .hero p {
      max-width: 480px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .download-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      width: min(100%, 400px);
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 12px 26px rgba(14, 165, 233, 0.3);
    }
    .btn-download:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-row strong { color: #e2e8f0; }
    footer {
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="brand">
        <div class="brand-icon">K</div>
        <div>
          <div>Kryptonbrowser</div>
          <div class="brand-sub">CBT SMP Negeri 3 Jayapura</div>
        </div>
      </div>
      <div class="nav-links">
        <span id="nav-version" class="capsule capsule-accent">...</span>
        <a class="capsule" href="https://github.com/gurukemarinsore/kryptonbrowser" target="_blank" rel="noopener">
          GitHub
        </a>
      </div>
    </nav>

    <main class="hero">
      <span class="capsule">
        <span class="dot-live"></span>
        Browser Ujian Resmi — Windows
      </span>
      <h1>Kryptonbrowser</h1>
      <p>
        Browser ujian resmi untuk <strong>CBT SMP Negeri 3 Jayapura</strong>.
        Ringan, aman, dan langsung siap pakai.
      </p>

      <div class="download-box">
        <a id="btn-download" class="btn-download" href="https://github.com/gurukemarinsore/kryptonbrowser/releases/latest">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span id="btn-download-label">Download Kryptonbrowser</span>
        </a>

        <div class="meta-row">
          <span>Versi: <strong id="meta-version">...</strong></span>
          <span>Rilis: <strong id="meta-date">-</strong></span>
          <span>Ukuran: <strong id="meta-size">-</strong></span>
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> SMP Negeri 3 Jayapura
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const REPO = "gurukemarinsore/kryptonbrowser";
    const API_URL = `https://api.github.com/repos/${REPO}/releases/latest`;
    const RELEASES_FALLBACK = `https://github.com/${REPO}/releases`;

    const navVersion = document.getElementById("nav-version");
    const metaVersion = document.getElementById("meta-version");
    const metaDate = document.getElementById("meta-date");
    const metaSize = document.getElementById("meta-size");
    const btnDownload = document.getElementById("btn-download");
    const btnDownloadLabel = document.getElementById("btn-download-label");

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "-";
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function formatDate(iso) {
      if (!iso) return "-";
      try {
        return new Date(iso).toLocaleDateString("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      } catch {
        return iso.slice(0, 10);
      }
    }

    async function loadLatestRelease() {
      try {
        const res = await fetch(API_URL, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!res.ok) throw new Error("No release yet");
        const data = await res.json();

        const tag = data.tag_name || "v1.2.1";
        navVersion.textContent = tag;
        metaVersion.textContent = tag;
        metaDate.textContent = formatDate(data.published_at);

        const assets = Array.isArray(data.assets) ? data.assets : [];
        const exeAsset =
          assets.find((a) => a.name.toLowerCase() === "kryptonbrowser.exe") ||
          assets.find((a) => a.name.toLowerCase().endsWith(".exe")) ||
          assets[0];

        if (exeAsset && exeAsset.browser_download_url) {
          btnDownload.href = exeAsset.browser_download_url;
          btnDownloadLabel.textContent = `Download Kryptonbrowser (${tag})`;
          metaSize.textContent = formatBytes(exeAsset.size);
        } else {
          btnDownload.href = data.html_url || RELEASES_FALLBACK;
          btnDownloadLabel.textContent = `Download (${tag})`;
        }
      } catch {
        navVersion.textContent = "Tersedia";
        metaVersion.textContent = "-";
        btnDownload.href = RELEASES_FALLBACK;
        btnDownloadLabel.textContent = "Download Kryptonbrowser";
      }
    }

    loadLatestRelease();
  </script>
</body>
</html>
